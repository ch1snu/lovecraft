<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>วันนี้วันอะไรหรอ?</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Prompt:wght@200;300;400&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #fafafa;
        --ink: #2b2b2b;
        --soft: #8a8a8a;
        --line: #dcdcdc;
        --rose: #f2728c;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #17151a;
          --ink: #ececec;
          --soft: #8f8f95;
          --line: #34323a;
        }
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        font-family: "Prompt", "Noto Sans Thai", sans-serif;
        font-weight: 300;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      form {
        width: 100%;
        max-width: 340px;
      }
      h1 {
        font-size: 1.15rem;
        font-weight: 400;
        margin: 0 0 6px;
      }
      .sub {
        color: var(--soft);
        font-size: 0.9rem;
        margin: 0 0 28px;
      }
      .row {
        display: flex;
        gap: 10px;
      }
      .row > div {
        flex: 1;
        min-width: 0;
      }
      .row > div.m {
        flex: 1.7;
      }
      label {
        display: block;
        font-size: 0.78rem;
        color: var(--soft);
        margin-bottom: 6px;
      }
      input,
      select {
        width: 100%;
        font: inherit;
        font-size: 1rem;
        color: var(--ink);
        background: transparent;
        border: 0;
        border-bottom: 1px solid var(--line);
        padding: 8px 2px;
        border-radius: 0;
        outline: none;
      }
      select option {
        color: #222;
      }
      input:focus,
      select:focus {
        border-bottom-color: var(--rose);
      }
      button.go {
        margin-top: 30px;
        width: 100%;
        font: inherit;
        font-size: 0.95rem;
        color: var(--bg);
        background: var(--ink);
        border: 0;
        padding: 13px;
        border-radius: 2px;
        cursor: pointer;
      }
      button.go:focus-visible,
      .again:focus-visible {
        outline: 2px solid var(--rose);
        outline-offset: 3px;
      }
      .err {
        min-height: 2.6em;
        margin-top: 14px;
        font-size: 0.85rem;
        color: var(--rose);
      }

      /* ===== ฉากเซอร์ไพรส์ ===== */
      .hint {
        display: block;
        margin: 6px auto 0;
        font: inherit;
        font-size: 0.85rem;
        color: var(--soft);
        background: none;
        border: 0;
        border-bottom: 1px dashed var(--line);
        padding: 2px 0;
        cursor: pointer;
      }
      .hint:hover {
        color: var(--rose);
      }
      .hint:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .hint:focus-visible {
        outline: 2px solid var(--rose);
        outline-offset: 3px;
      }
      .hint.nudge {
        color: var(--rose);
        animation: nudge 1.4s 3;
      }
      @keyframes nudge {
        50% {
          transform: scale(1.12);
        }
      }
      .ht {
        min-height: 3em;
        margin: 14px 0 0;
        text-align: center;
        font-size: 0.88rem;
        line-height: 1.7;
        color: var(--soft);
      }
      #show {
        position: fixed;
        inset: 0;
        z-index: 10;
        background: #14101a;
        color: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        opacity: 0;
        visibility: hidden;
        transition: opacity 1.2s;
      }
      #show.on {
        opacity: 1;
        visibility: visible;
      }
      #fw {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .stage {
        position: relative;
        z-index: 2;
        width: 100%;
        max-width: 420px;
      }
      .heart {
        width: 150px;
        height: 135px;
        margin: 0 auto;
        position: relative;
      }
      .heart svg {
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      .heart path {
        fill: #f2728c00;
        stroke: var(--rose);
        stroke-width: 1.2;
        transition: fill 1.6s;
      }
      .heart.fill path {
        fill: #f2728c33;
      }
      .heart b {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding-bottom: 12px;
        font-size: 3.4rem;
        font-weight: 200;
        opacity: 0;
        transform: scale(0.5);
        transition: all 1s cubic-bezier(0.2, 1.4, 0.4, 1);
      }
      .heart.fill b {
        opacity: 1;
        transform: none;
      }
      .title {
        font-size: 1.5rem;
        font-weight: 200;
        letter-spacing: 0.28em;
        margin: 28px 0 6px;
        min-height: 2em;
      }
      .title span {
        display: inline-block;
        opacity: 0;
        transform: translateY(12px);
        transition: all 0.7s;
      }
      .title span.in {
        opacity: 1;
        transform: none;
      }
      .date {
        color: #ffffff80;
        font-size: 0.85rem;
        letter-spacing: 0.2em;
        opacity: 0;
        transition: opacity 1.5s;
      }
      .date.in {
        opacity: 1;
      }
      .heart {
        transition: all 1s;
      }
      .heart.sm {
        width: 64px;
        height: 58px;
      }
      .heart.sm b {
        font-size: 1.5rem;
        padding-bottom: 5px;
      }
      .pic {
        height: 0;
        overflow: hidden;
        opacity: 0;
        transition: all 1s;
      }
      .pic.show {
        height: 200px;
        opacity: 1;
        margin-top: 20px;
        padding: 4px 0;
      }
      .pic img {
        height: 100%;
        max-width: 100%;
        border: 6px solid #fff;
        border-radius: 3px;
        box-shadow: 0 8px 30px #0008;
        transform: rotate(-2deg);
      }
      .wish {
        min-height: 7.5em;
        margin-top: 20px;
        font-size: 1.02rem;
        line-height: 1.9;
        color: #ffffffd9;
        opacity: 0;
        transition: opacity 1s;
      }
      .wish.in {
        opacity: 1;
      }
      .from {
        color: var(--rose);
        margin-top: 6px;
        opacity: 0;
        transition: opacity 1.5s;
      }
      .from.in {
        opacity: 1;
      }
      .dots {
        display: flex;
        gap: 8px;
        justify-content: center;
        margin-top: 14px;
      }
      .dots i {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #ffffff33;
        transition: background 0.5s;
      }
      .dots i.on {
        background: var(--rose);
      }
      .again {
        margin-top: 20px;
        font: inherit;
        font-size: 0.8rem;
        color: #ffffff80;
        background: none;
        border: 0;
        cursor: pointer;
        opacity: 0;
        pointer-events: none;
        transition: opacity 1s;
      }
      .again.in {
        opacity: 1;
        pointer-events: auto;
      }
    </style>
  </head>
  <body>
    <form id="f" autocomplete="off">
      <h1></h1>
      <p class="sub">กรอกวันที่ของวันนี้</p>
      <p class="sub">(อันนี้เป็นตัวอย่างกรุณากรอก 1 มกราคม 1)</p>
      <div class="row">
        <div>
          <label for="d">วัน</label
          ><input id="d" type="number" inputmode="numeric" min="1" max="31" />
        </div>
        <div class="m">
          <label for="m">เดือน</label>
          <select id="m">
            <option value=""></option>
            <option value="1">มกราคม</option>
            <option value="2">กุมภาพันธ์</option>
            <option value="3">มีนาคม</option>
            <option value="4">เมษายน</option>
            <option value="5">พฤษภาคม</option>
            <option value="6">มิถุนายน</option>
            <option value="7">กรกฎาคม</option>
            <option value="8">สิงหาคม</option>
            <option value="9">กันยายน</option>
            <option value="10">ตุลาคม</option>
            <option value="11">พฤศจิกายน</option>
            <option value="12">ธันวาคม</option>
          </select>
        </div>
        <div>
          <label for="y">ปี</label
          ><input id="y" type="number" inputmode="numeric" />
        </div>
      </div>
      <button class="go" type="submit">ตกลง</button>
      <div class="err" id="err" role="status"></div>
      <button class="hint" id="hint" type="button">ขอคำใบ้หน่อย 💡</button>
      <p class="ht" id="ht" role="status"></p>
    </form>

    <div id="show" aria-live="polite">
      <canvas id="fw"></canvas>
      <div class="stage">
        <div class="heart" id="heart">
          <svg viewBox="0 0 100 90">
            <path
              id="hp"
              d="M50 85C10 55 0 30 15 15 28 3 45 10 50 25 55 10 72 3 85 15 100 30 90 55 50 85Z"
            />
          </svg>
          <b></b>
        </div>
        <div class="title" id="title"></div>
        <div class="date" id="date"></div>
        <div class="pic" id="pic"><img id="pimg" alt="" /></div>
        <div class="wish" id="wish"></div>
        <div class="dots" id="dots"></div>
        <div class="from" id="from"></div>
        <button class="again" id="again">ดูอีกครั้ง</button>
      </div>
    </div>

    <script>
      /* ====== แก้ข้อความตรงนี้ได้เลย ====== */
      const FROM = "รักเธอที่สุด"; // เช่น "จาก ... ของเธอ"
      const DATE_TEXT = "d · m · y";
      const TITLE = "Happy 3 Months";
      const WISHES = [
        "ขอบคุณที่เข้ามาในชีวิตของเรานะ\n3 เดือนที่ผ่านมามีความสุขมากจริงๆ",
        "ขอบคุณที่อยู่ข้างๆ ทั้งวันที่ยิ้มและวันที่เหนื่อย\nแค่มีเธอ ทุกอย่างก็ดีขึ้นแล้ว",
        "ขอให้เรามีวันดีๆ แบบนี้ไปอีกเรื่อยๆ\n6 เดือน 1 ปี และอีกหลายปีเลยนะ",
        "ขอให้เราดูแลกัน เข้าใจกัน\nและรักกันมากขึ้นทุกวัน",
        "สุดท้ายนี้... รักเธอนะ\nHappy Anniversary",
      ];
      /* รูปประกอบแต่ละข้อความ (ข้อ 1-5) เว้นว่าง "" ถ้าข้อนั้นไม่ใช้รูป */
      /* วิธีใส่รูป: ใส่ชื่อไฟล์ในโฟลเดอร์เดียวกัน เช่น "photo1.jpg" หรือลิงก์รูป https://... ตามลำดับข้อความ 1-5
   (รูปจะแสดงเมื่อเปิดไฟล์นี้เองหรืออัปโหลดขึ้นเว็บโฮสต์ของคุณ ไม่แสดงในลิงก์ claude.ai) */
      const IMGS = [
        "./img/1.jpeg", // รูปข้อความที่ 1
        "./img/2.jpeg", // รูปข้อความที่ 2
        "./img/3.jpeg", // รูปข้อความที่ 3
        "./img/4.jpeg", // รูปข้อความที่ 4
        "./img/5.jpeg", // รูปข้อความที่ 5
      ];
      /* คำใบ้ที่จะขึ้นทีละข้อเมื่อกดปุ่ม "ขอคำใบ้" (ยิ่งกดยิ่งใบ้ชัด) แก้ข้อความได้ตามใจ */
      /* คำใบ้ที่จะขึ้นเมื่อกดปุ่ม "ขอคำใบ้" แก้ข้อความได้ตามใจ */
      const HINT =
        "วันครบรอ บ";
      const TARGET = { d: 1, m: 1, years: [1, 1] };
      /* =================================== */

      const $ = (id) => document.getElementById(id);
      const wait = (ms) => new Promise((r) => setTimeout(r, ms));

      $("f").addEventListener("submit", (e) => {
        e.preventDefault();
        const d = +$("d").value,
          m = +$("m").value,
          y = +$("y").value;
        if (!d || !m || !y) {
          $("err").textContent = "กรอกให้ครบทั้งวัน เดือน ปี";
          return;
        }
        if (d === TARGET.d && m === TARGET.m && TARGET.years.includes(y)) {
          $("err").textContent = "";
          play();
        } else {
          $("err").textContent = "วันที่ยังไม่ถูกต้อง ลองดูปฏิทินอีกครั้งนะ";
          if (!$("hint").disabled) $("hint").classList.add("nudge");
        }
      });

      /* ---------- ดอกไม้ไฟ ---------- */
      $("hint").onclick = () => {
        $("ht").textContent = HINT;
        $("hint").classList.remove("nudge");
        $("hint").textContent = "ใบ้ให้แล้วนะ";
        $("hint").disabled = true;
      };
      const cv = $("fw"),
        cx = cv.getContext("2d");
      let parts = [],
        running = false;
      function size() {
        cv.width = innerWidth;
        cv.height = innerHeight;
        cx.fillStyle = "#14101a";
        cx.fillRect(0, 0, cv.width, cv.height);
      }
      size();
      addEventListener("resize", size);
      const COLORS = ["#f2728c", "#ffd9e1", "#ffffff", "#f7c873"];
      function firework(x, y, n = 46) {
        const c = COLORS[Math.floor(Math.random() * COLORS.length)];
        for (let i = 0; i < n; i++) {
          const a = (i / n) * Math.PI * 2,
            v = 1.5 + Math.random() * 3;
          parts.push({
            x,
            y,
            vx: Math.cos(a) * v,
            vy: Math.sin(a) * v,
            life: 1,
            c,
          });
        }
        if (!running) {
          running = true;
          tick();
        }
      }
      function tick() {
        cx.globalCompositeOperation = "source-over";
        cx.fillStyle = "rgba(20,16,26,.2)";
        cx.fillRect(0, 0, cv.width, cv.height);
        parts.forEach((p) => {
          p.vy += 0.03;
          p.vx *= 0.985;
          p.vy *= 0.985;
          p.x += p.vx;
          p.y += p.vy;
          p.life -= 0.011;
          cx.globalAlpha = Math.max(p.life, 0);
          cx.fillStyle = p.c;
          cx.beginPath();
          cx.arc(p.x, p.y, 1.7, 0, 7);
          cx.fill();
        });
        cx.globalAlpha = 1;
        parts = parts.filter((p) => p.life > 0);
        if (parts.length) requestAnimationFrame(tick);
        else running = false;
      }
      async function salvo(rounds) {
        for (let i = 0; i < rounds; i++) {
          firework(
            cv.width * (0.15 + Math.random() * 0.7),
            cv.height * (0.12 + Math.random() * 0.4),
          );
          await wait(450 + Math.random() * 500);
        }
      }

      /* ---------- ลำดับฉาก ---------- */
      let token = 0;
      async function play() {
        const me = ++token,
          alive = () => me === token;
        const show = $("show"),
          heart = $("heart"),
          hp = $("hp");
        heart.classList.remove("fill", "sm");
        $("pic").classList.remove("show");
        ["date", "wish", "from", "again"].forEach((i) =>
          $(i).classList.remove("in"),
        );
        $("title").innerHTML = "";
        $("wish").textContent = "";
        $("from").textContent = "";
        $("dots").innerHTML = "";
        const len = hp.getTotalLength();
        hp.style.transition = "none";
        hp.style.strokeDasharray = len;
        hp.style.strokeDashoffset = len;
        size();
        show.classList.add("on");
        await wait(1300);
        if (!alive()) return;

        hp.getBoundingClientRect();
        hp.style.transition = "stroke-dashoffset 2.2s ease-in-out, fill 1.6s";
        hp.style.strokeDashoffset = 0;
        await wait(2300);
        if (!alive()) return;
        heart.classList.add("fill");
        firework(cv.width / 2, cv.height * 0.28, 70);
        await wait(900);
        if (!alive()) return;

        [...TITLE].forEach((ch) => {
          const s = document.createElement("span");
          s.innerHTML = ch === " " ? "&nbsp;" : ch;
          $("title").appendChild(s);
        });
        const letters = [...$("title").children];
        for (const s of letters) {
          s.classList.add("in");
          await wait(70);
        }
        $("date").textContent = DATE_TEXT;
        $("date").classList.add("in");
        salvo(7);
        await wait(2200);
        if (!alive()) return;

        WISHES.forEach(() =>
          $("dots").appendChild(document.createElement("i")),
        );
        for (let i = 0; i < WISHES.length; i++) {
          $("wish").classList.remove("in");
          $("pic").classList.remove("show");
          heart.classList.add("sm");
          await wait(900);
          if (!alive()) return;
          if (IMGS[i]) {
            $("pimg").src = IMGS[i];
            $("pic").classList.add("show");
          }
          $("wish").innerHTML = WISHES[i].replace(/\n/g, "<br>");
          $("wish").classList.add("in");
          [...$("dots").children].forEach((d, k) =>
            d.classList.toggle("on", k === i),
          );
          if (i === WISHES.length - 1) salvo(10);
          await wait(i === WISHES.length - 1 ? 3000 : 4200);
          if (!alive()) return;
        }
        $("from").textContent = FROM;
        $("from").classList.add("in");
        $("again").classList.add("in");
      }
      $("again").onclick = play;
    </script>
  </body>
</html>
