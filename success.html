<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>สั่งซื้อสำเร็จ ♡ LoveCraft</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap");

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        padding: 22px;
        display: grid;
        place-items: center;
        font-family: "Kanit", sans-serif;
        font-weight: 300;
        color: #55434b;
        background: linear-gradient(145deg, #fff8f8, #fff0f5, #fffaf2);
      }

      .card {
        width: 100%;
        max-width: 430px;
        padding: 35px 27px;
        border: 1px solid #f6e0e7;
        border-radius: 28px;
        background: #ffffffdf;
        box-shadow: 0 18px 55px #d49aaf20;
        text-align: center;
        animation: appear 0.65s ease;
      }

      .logo {
        color: #ce7894;
        font-size: 22px;
        font-weight: 600;
        margin-bottom: 23px;
      }

      .logo span {
        color: #e99bb3;
      }

      .illustration {
        width: 115px;
        height: 115px;
        display: grid;
        place-items: center;
        margin: 0 auto 23px;
        border-radius: 35px;
        background: #fff0f5;
        font-size: 57px;
        animation: bounce 2s infinite;
      }

      .pill {
        display: inline-block;
        padding: 6px 13px;
        border-radius: 30px;
        background: #eaf7ee;
        color: #619b76;
        font-size: 11px;
        letter-spacing: 0.5px;
      }

      h1 {
        margin: 17px 0 10px;
        color: #c96f8d;
        font-size: 27px;
        font-weight: 500;
      }

      .description {
        margin: 0;
        color: #98858d;
        font-size: 13px;
        line-height: 2;
      }

      .note {
        margin: 24px 0;
        padding: 15px;
        border: 1px dashed #efc5d2;
        border-radius: 16px;
        background: #fff8fa;
        font-size: 12px;
        line-height: 1.9;
      }

      .btn {
        display: block;
        width: 100%;
        padding: 13px;
        margin-top: 11px;
        border: none;
        border-radius: 14px;
        text-decoration: none;
        font-family: inherit;
        font-size: 13px;
        cursor: pointer;
        transition: 0.2s;
      }

      .btn:hover {
        transform: translateY(-2px);
      }

      .primary {
        background: linear-gradient(135deg, #f1a9bf, #df85a1);
        color: white;
        box-shadow: 0 7px 17px #e6a3b640;
      }

      .secondary {
        background: #fff0f4;
        color: #c87893;
      }

      .footer {
        margin-top: 24px;
        color: #b6a2aa;
        font-size: 11px;
      }

      .heart {
        position: fixed;
        bottom: -30px;
        pointer-events: none;
        animation: floatUp 3s ease-out forwards;
      }

      @keyframes appear {
        from {
          opacity: 0;
          transform: translateY(15px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes bounce {
        0%,
        100% {
          transform: translateY(0) rotate(0);
        }
        50% {
          transform: translateY(-7px) rotate(-4deg);
        }
      }

      @keyframes floatUp {
        to {
          transform: translateY(-110vh) rotate(30deg);
          opacity: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="logo">♡ Love<span>Craft</span></div>

      <div class="illustration" aria-hidden="true">💌</div>

      <span class="pill">✓ ORDER SUCCESS</span>

      <h1>สั่งซื้อสำเร็จแล้ว!</h1>

      <p class="description">
        เย้! เราได้รับคำสั่งซื้อของคุณแล้ว ♡<br />
        ขอบคุณที่เลือก LoveCraft<br />
        หวังว่าของขวัญชิ้นนี้จะทำให้ใครบางคนยิ้มได้นะ
      </p>

      <div class="note">
        🎀 <strong>ขอบคุณจากใจเลยนะ</strong><br />
        <h2>รอจ่ายเงินเเละรับเว็บไซต์ของคุณได้ที่อีเมล ♡</b><br />
      </div>

      <a class="btn primary" href="index.html"> ♡ กลับหน้าหลัก </a>

      <button class="btn secondary" id="heartBtn" type="button">
        ส่งหัวใจให้ LoveCraft 💗
      </button>

      <div class="footer">Made with ♡ by LoveCraft</div>
    </main>

    <script>
      document.getElementById("heartBtn").addEventListener("click", () => {
        for (let i = 0; i < 18; i++) {
          const heart = document.createElement("span");
          heart.className = "heart";
          heart.textContent = ["💗", "💕", "♡", "🌸"][
            Math.floor(Math.random() * 4)
          ];
          heart.style.left = Math.random() * 100 + "vw";
          heart.style.fontSize = 15 + Math.random() * 18 + "px";
          heart.style.animationDelay = Math.random() * 0.8 + "s";
          document.body.appendChild(heart);
          setTimeout(() => heart.remove(), 4000);
        }
      });
    </script>
  </body>
</html>
